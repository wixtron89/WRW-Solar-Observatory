[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = "0s"
  hostname = "raspberrypi"

# 1. Collect CPU metrics
[[inputs.cpu]]
  percpu = false
  totalcpu = true
  collect_cpu_time = false
  report_active = false

# 2. Output metrics to MQTT Broker
[[outputs.mqtt]]
  ## FIXED: Changed the last dot to a colon to properly set the port
  servers = ["tcp://192.168.6.172:1883"]

  ## The topic where Telegraf will publish its metrics.
  topic = "pubdata/telegraf/cpu"
  client_id = "telegraf1"

  ## Data format to write.
  data_format = "json"

  ## Optional: Retention and Quality of Service (QoS)
  qos = 0
  retain = false
  keep_alive = 30

  ## Optional: If your Mosquitto broker requires authentication
  username = "ubroker1"
  password = "chat"
