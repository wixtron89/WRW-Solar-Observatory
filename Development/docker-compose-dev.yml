

networks:
  default:
    driver: bridge
    ipam:
      driver: default
  nextcloud:
    driver: bridge
    internal: true
    ipam:
      driver: default

services:
  telegraf:
    container_name: telegraf
    build: ./.templates/telegraf/.
    hostname: iotstack # optional
    restart: unless-stopped
    environment:
    - TZ=${TZ:-Etc/UTC}
    ports:
    - "8092:8092/udp"
    - "8094:8094/tcp"
    - "8125:8125/udp"
    volumes:
    - ./volumes/telegraf:/etc/telegraf
    - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
    - influxdb
    - mqbroker

  mqbroker:
    container_name: mqbroker
    build:
      context: ./.templates/mosquitto/.
      args:
      - MOSQUITTO_BASE=eclipse-mosquitto:latest
    restart: unless-stopped
    environment:
    - TZ=${TZ:-Etc/UTC}
    ports:
    - "1884:1883"
    volumes:
    - ./volumes/mqbroker/config:/mosquitto/config
    - ./volumes/mqbroker/data:/mosquitto/data
    - ./volumes/mqbroker/log:/mosquitto/log
    - ./volumes/mqbroker/pwfile:/mosquitto/pwfile
    healthcheck:
      disable: true

  mqbridge:
    container_name: mqbridge
    build:
      context: ./.templates/mosquitto/.
      args:
      - MOSQUITTO_BASE=eclipse-mosquitto:2.0.22
    restart: unless-stopped
    environment:
    - TZ=${TZ:-Etc/UTC}
    ports:
    - "1883:1883"
    volumes:
    - ./volumes/mqbridge/config:/mosquitto/config
    - ./volumes/mqbridge/data:/mosquitto/data
    - ./volumes/mqbridge/log:/mosquitto/log
    - ./volumes/mqbridge/pwfile:/mosquitto/pwfile
    healthcheck:
      disable: true

  grafana:
    container_name: grafana
    image: grafana/grafana
    restart: unless-stopped
    user: "0"
    ports:
    - "3000:3000"
    environment:
    - TZ=${TZ:-Etc/UTC}
    - GF_PATHS_DATA=/var/lib/grafana
    - GF_PATHS_LOGS=/var/log/grafana
    volumes:
    - ./volumes/grafana/data:/var/lib/grafana
    - ./volumes/grafana/log:/var/log/grafana
    healthcheck:
      test: ["CMD", "wget", "-O", "/dev/null", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  influxdb:
    container_name: influxdb
    image: "influxdb:1.12"
    restart: unless-stopped
    user: "0"
    ports:
    - "8086:8086"
    environment:
    - TZ=${TZ:-Etc/UTC}
    - INFLUXDB_HTTP_FLUX_ENABLED=false
    - INFLUXDB_REPORTING_DISABLED=false
    - INFLUXDB_HTTP_AUTH_ENABLED=true
    - INFLUXDB_MONITOR_STORE_ENABLED=FALSE
    - INFLUX_USERNAME=dba
    - INFLUX_PASSWORD=unimatrix
    - INFLUXDB_REPORTING_DISABLED=true
  # - INFLUXDB_UDP_ENABLED: false
  # - INFLUXDB_UDP_BIND_ADDRESS: 0.0.0.0:8086
  # - INFLUXDB_UDP_DATABASE: udp
    volumes:
    - ./volumes/influxdb/data:/var/lib/influxdb
    - ./backups/influxdb/db:/var/lib/influxdb/backup
    healthcheck:
      test: ["CMD", "curl", "http://localhost:8086"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  nodered:
    container_name: nodered
    build:
      context: ./services/nodered/.
      args:
      - DOCKERHUB_TAG=latest
      - EXTRA_PACKAGES=
    restart: unless-stopped
    user: "0"
    environment:
    - TZ=${TZ:-Etc/UTC}
    ports:
    - "1880:1880"
    volumes:
    - ./volumes/nodered/data:/data
    - ./volumes/nodered/ssh:/root/.ssh

  portainer-ce:
    container_name: portainer-ce
    image: portainer/portainer-ce
    restart: unless-stopped
    ports:
    - "8000:8000"
    - "9000:9000"
    # HTTPS
    - "9443:9443"
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - ./volumes/portainer-ce/data:/data
    command: --no-setup-token


