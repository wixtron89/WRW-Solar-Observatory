networks:
  default:
    driver: bridge
    ipam:
      driver: default

services:
  # ----------------------------------------------------
  # MQ-BROKER
  # ----------------------------------------------------
  # mqbroker:
    # image: eclipse-mosquitto:latest
    # container_name: mqbroker
    # restart: unless-stopped
    # environment:
      # - TZ=${TZ:-Etc/UTC}
    # ports:
      # - "1884:1883"
      # - "9002:9001"
    # volumes:
      # - /home/pi/wrwodev/volumes/mqbroker/config:/mosquitto/config
      # - /home/pi/wrwodev/volumes/mqbroker/data:/mosquitto/data
      # - /home/pi/wrwodev/volumes/mqbroker/log:/mosquitto/log
      # - /home/pi/wrwodev/volumes/mqbroker/pwfile:/mosquitto/pwfile      
     # # - /etc/localtime:/etc/localtime:ro
     # # - /etc/timezone:/etc/timezone:ro
  # #  networks:
   # #   - iot-network

  # ----------------------------------------------------
  # MQ-BRIDGE
  # ----------------------------------------------------
  mqbridge:
    image: eclipse-mosquitto:2.0.22
    container_name: mqbridge
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Etc/UTC}
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - /home/pi/wrwodev/volumes/mqbridge/config:/mosquitto/config
      - /home/pi/wrwodev/volumes/mqbridge/data:/mosquitto/data
      - /home/pi/wrwodev/volumes/mqbridge/log:/mosquitto/log
      - /home/pi/wrwodev/volumes/mqbridge/pwfile:/mosquitto/pwfile 
    #  - /etc/localtime:/etc/localtime:ro
    #  - /etc/timezone:/etc/timezone:ro
   # networks:
   #   - iot-network

  # ----------------------------------------------------
  # InfluxDB v1
  # ----------------------------------------------------
  influxdb1:
    image: influxdb:1.8
    container_name: influxdb1
    restart: unless-stopped
    user: "0"
    ports:
      - "8086:8086"
    volumes:
      - /home/pi/wrwodev/volumes/influxdb/data:/var/lib/influxdb
      - /home/pi/wrwodev/volumes/backups/influxdb/db:/var/lib/influxdb/backup
    environment:
      - TZ=Asia/Jakarta
      - INFLUXDB_DB=mydb
      - INFLUXDB_ADMIN_USER=dba
      - INFLUXDB_ADMIN_PASSWORD=unimatrix
  #  networks:
   #   - iot-network

  # ----------------------------------------------------
  # Portainer
  # ----------------------------------------------------
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/pi/wrwodev/volumes/portainer/data:/data
    environment:
      - TZ=Asia/Jakarta
    command: --no-setup-token

  #  networks:
  #    - iot-network

  # ----------------------------------------------------
  # Node-RED
  # ----------------------------------------------------
  nodered:
    image: nodered/node-red:latest
    container_name: nodered
    restart: unless-stopped
    ports:
      - "1880:1880"
    user: "0"
    volumes:
      - /home/pi/wrwodev/volumes/nodered:/data
      - /home/pi/wrwodev/volumes/nodered/ssh:/root/.ssh
    environment:
      - TZ=Asia/Jakarta
    depends_on:
   #   - mqbroker
      - mqbridge
      - influxdb1
  #  networks:
  #    - iot-network

  # ----------------------------------------------------
  # Grafana
  # ----------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Etc/UTC}
      - GF_PATHS_DATA=/var/lib/grafana
      - GF_PATHS_LOGS=/var/log/grafana
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=grafanapassword

    ports:
      - "3000:3000"
    user: "0"
    volumes:
      - /home/pi/wrwodev/volumes/grafana/data:/var/lib/grafana

 #   depends_on:
  #    - influxdb1
#    networks:
 #     - iot-network
