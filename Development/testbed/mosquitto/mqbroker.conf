# MQ-BROKER (used for both SOM and CAM). Receives from MQ-BRIDGE, Node-RED subscribes.
per_listener_settings false
listener 1883
allow_anonymous false
password_file /mosquitto/run/pwfile

persistence true
persistence_location /mosquitto/data/
autosave_interval 10
# keep messages for Node-RED's persistent session if Node-RED restarts
max_queued_messages 0
max_queued_bytes 200000000
persistent_client_expiration 7d

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
