# =====================================================================
# MQ-BRIDGE (SOM)  -  Lunatico, Alcor, telegraf ... publish here
#   devices --(pubdata/#)--> MQ-BRIDGE --> MQ-BROKER SOM  (same machine)
#                                    \---> MQ-BROKER CAM  (over the network)
# ${VARS} are filled in from the environment by entrypoint.sh
# =====================================================================
per_listener_settings false
listener 1883
allow_anonymous false
password_file /mosquitto/run/pwfile

# Adds MQTT5 user property  timestamp=<unix ns>  to every message on arrival.
# Load it ONLY here: then SOM and CAM receive the identical timestamp.
plugin /mosquitto/plugins/mosquitto_message_timestamp.so

persistence true
persistence_location /mosquitto/data/
autosave_interval 10

# Default is 1000 messages per client: beyond that messages are DROPPED while a
# link is down. 0 = no count limit; the byte limit protects the RAM.
max_queued_messages 0
max_queued_bytes ${BRIDGE_MAX_QUEUED_BYTES}
# devices that publish QoS 0 are delivered to the bridge at the bridge's QoS (1)
# so they are queued as well
upgrade_outgoing_qos true

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

# ----------------------------------------------------- to MQ-BROKER SOM
connection som-local
address ${SOM_BROKER_HOST}:${SOM_BROKER_PORT}
bridge_protocol_version mqttv50
remote_clientid bridge-som-local
local_clientid bridge-som-local.l
remote_username bridge
remote_password ${BRIDGE_PASS}
cleansession false
try_private true
notifications true
restart_timeout 2 30
topic pubdata/# out 1 "" wrwo/som/

# ----------------------------------------------------- to MQ-BROKER CAM
connection som-to-cam
address ${CAM_BROKER_HOST}:${CAM_BROKER_PORT}
bridge_protocol_version mqttv50
remote_clientid bridge-som-cam
local_clientid bridge-som-cam.l
remote_username bridge
remote_password ${BRIDGE_PASS}
cleansession false
try_private true
notifications true
restart_timeout 2 30
# default 60 s -> a silent drop (WiFi, cable) is noticed only after ~90 s
keepalive_interval ${BRIDGE_CAM_KEEPALIVE}
topic pubdata/# out 1 "" wrwo/som/
