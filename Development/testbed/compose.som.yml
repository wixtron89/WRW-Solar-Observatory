# WRW observatory telemetry - SOM machine
#
#  Lunatico, Alcor (simulator) --> mqbridge --+--> mqbroker-som --> nodered-som --> influx-som --> grafana-som
#                                             +--> CAM broker (compose.cam.yml, other machine)
#
# Selected by ROLE=som in .env; needs CAM_IP. Simulator only with COMPOSE_PROFILES=sim.

name: wrw-som

x-mosquitto: &mosquitto
  restart: unless-stopped
  # strip Windows CRLF (git autocrlf / editors) before running the script
  entrypoint: ["/bin/sh", "-c", "tr -d '\\r' < /entrypoint.sh > /tmp/entrypoint.sh && exec /bin/sh /tmp/entrypoint.sh"]
  environment: &mqenv
    TZ: ${TZ:-Asia/Jakarta}

x-influx: &influx
  image: influxdb:${INFLUX_VERSION:-1.12}
  restart: unless-stopped
  environment:
    TZ: ${TZ:-Asia/Jakarta}
    INFLUXDB_DB: ${INFLUX_DB:-wrwo}             # created on first init
    INFLUXDB_HTTP_AUTH_ENABLED: "false"
    INFLUXDB_REPORTING_DISABLED: "true"
  healthcheck:
    test: ["CMD", "influx", "-execute", "SHOW DATABASES"]
    interval: 5s
    timeout: 5s
    retries: 30
    start_period: 10s

x-grafana: &grafana
  image: grafana/grafana:${GRAFANA_VERSION:-11.6.0}
  restart: unless-stopped
  environment: &grafenv
    TZ: ${TZ:-Asia/Jakarta}
    INFLUX_DB: ${INFLUX_DB:-wrwo}                 # used by provisioning/datasources/influx.yml
    GF_SECURITY_ADMIN_USER: admin
    GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASS}   # only applied on first start
    GF_AUTH_ANONYMOUS_ENABLED: "true"             # dev: dashboards viewable without login
    GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    GF_ANALYTICS_REPORTING_ENABLED: "false"
    GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/wrwo.json

services:
  mqbridge:
    <<: *mosquitto
    build:
      context: ./mosquitto
      dockerfile: Dockerfile.bridge
      args:
        MOSQUITTO_VERSION: ${MOSQUITTO_VERSION:-2.0.22}
    ports:
      - "${BRIDGE_PORT:-1883}:1883"            # devices connect here
    environment:
      <<: *mqenv
      MQ_USERS: "device:${DEVICE_PASS}"
      BRIDGE_PASS: ${BRIDGE_PASS}
      SOM_BROKER_HOST: mqbroker-som
      SOM_BROKER_PORT: "1883"
      # split machines: CAM_IP + CAM's published port; compose.all.yml sets BRIDGE_CAM_*
      # to the container name / internal port instead
      CAM_BROKER_HOST: ${BRIDGE_CAM_HOST:-${CAM_IP:?set CAM_IP in .env (IP of the CAM machine)}}
      CAM_BROKER_PORT: ${BRIDGE_CAM_PORT:-${CAM_BROKER_PUBLISH_PORT:-1885}}
      BRIDGE_CAM_KEEPALIVE: ${BRIDGE_CAM_KEEPALIVE:-20}
      BRIDGE_MAX_QUEUED_BYTES: ${BRIDGE_MAX_QUEUED_BYTES:-500000000}
    volumes:
      - ./mosquitto/entrypoint.sh:/entrypoint.sh:ro
      - ./mosquitto/mqbridge.conf:/mosquitto/config/mosquitto.conf:ro
      - mqbridge-data:/mosquitto/data

  mqbroker-som:
    <<: *mosquitto
    image: eclipse-mosquitto:${MOSQUITTO_VERSION:-2.0.22}
    ports:
      - "${SOM_BROKER_PUBLISH_PORT:-1884}:1883"
    environment:
      <<: *mqenv
      MQ_USERS: "bridge:${BRIDGE_PASS} nodered:${NODERED_MQTT_PASS}"
    volumes:
      - ./mosquitto/entrypoint.sh:/entrypoint.sh:ro
      - ./mosquitto/mqbroker.conf:/mosquitto/config/mosquitto.conf:ro
      - mqbroker-som-data:/mosquitto/data

  nodered-som:
    image: nodered/node-red:${NODERED_VERSION:-4.0}
    restart: unless-stopped
    user: "${NODERED_UID:-1000}:${NODERED_GID:-1000}"   # host user (Pi: id -u), so files in ./nodered stay yours
    depends_on:
      mqbroker-som: {condition: service_started}
      influx-som: {condition: service_healthy}
    ports:
      - "${SOM_NODERED_PORT:-1880}:1880"
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      MQTT_HOST: mqbroker-som
      MQTT_PORT: "1883"
      MQTT_CLIENT_ID: nodered-som
      MQTT_USER: nodered
      MQTT_PASS: ${NODERED_MQTT_PASS}
      INFLUX_WRITE_URL: http://influx-som:8086/write?db=${INFLUX_DB:-wrwo}&precision=ns
      INFLUX_CREATE_DB_URL: http://influx-som:8086/query?q=CREATE%20DATABASE%20${INFLUX_DB:-wrwo}
      INFLUX_QUERY_URL: http://influx-som:8086/query
      INFLUX_DB: ${INFLUX_DB:-wrwo}
    volumes:
      - ./nodered/som/data:/data

  influx-som:
    <<: *influx
    ports:
      - "${SOM_INFLUX_PORT:-8086}:8086"
    volumes:
      - influx-som-data:/var/lib/influxdb

  grafana-som:
    <<: *grafana
    depends_on:
      influx-som: {condition: service_healthy}
    ports:
      - "${SOM_GRAFANA_PORT:-3000}:3000"
    environment:
      <<: *grafenv
      INFLUX_URL: http://influx-som:8086
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-som-data:/var/lib/grafana

  simulator:
    build: ./simulator
    profiles: [sim]
    restart: unless-stopped
    depends_on: [mqbridge]
    environment:
      BRIDGE_HOST: mqbridge
      DEVICE_USER: device
      DEVICE_PASS: ${DEVICE_PASS}
      INTERVAL: ${SIM_INTERVAL:-2}
      CW_INTERVAL: ${SIM_CW_INTERVAL:-30}
      QOS: "0"

volumes:
  mqbridge-data:
  mqbroker-som-data:
  influx-som-data:
  grafana-som-data:
